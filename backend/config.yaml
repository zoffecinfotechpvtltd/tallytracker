tally:
  host: localhost
  port: 9000
  company_name: "Your Company Name"

polling:
  interval_minutes: 5

alerts:
  enabled: false   # pull-only by default - open the dashboard to see changes.
                    # flip true once you wire an actual push channel (email/WhatsApp) in notifier.py

stock:
  low_stock_threshold: 10

billing:
  # Used only when Tally gives no due-date signal at all for a bill - your
  # standard credit terms, applied as bill_date + this many days, so such
  # bills still get a real due date instead of showing "No due date".
  default_credit_days: 30

database:
  path: "./tally.db"
